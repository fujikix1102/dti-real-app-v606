name: DTI R2 artifact monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  r2-artifact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DTI_EXTERNAL_STORAGE_BACKEND: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'dti-perfect-fit-artifacts' }}
      R2_PREFIX: ${{ vars.R2_PREFIX || 'dti-perfect-fit' }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://dti-perfect-fit.streamlit.app/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitor dependency
        run: python -m pip install requests

      - name: Verify required secrets
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"

      - name: Smoke-check public app and R2 artifacts
        run: |
          set -o pipefail
          mkdir -p monitor-output
          python scripts/r2_artifact_smoke.py \
            --public-url "$PUBLIC_APP_URL" \
            --min-run-count 1 \
            --max-artifacts 5 \
            | tee monitor-output/r2-artifact-smoke.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dti-r2-artifact-smoke
          path: monitor-output/r2-artifact-smoke.json
